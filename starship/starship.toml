command_timeout = 2000

format = "[╭╴](#64748b bold)$directory$git_branch$git_status$python$java$nodejs$golang$kubernetes$fill$time\n$character"
# right_format = "$time"

[character]
success_symbol = "[╰⎯](#64748b bold)"
error_symbol = "[╰⎯](#64748b bold)"
# ╭╴ ╰─

[os]
format = '[$symbol](bold white) '   
disabled = false

[os.symbols]
Windows = ' '
Arch = '󰣇'
Ubuntu = ''
Macos = '󰀵'
Unknown = '󰠥'

# Shows the username
[username]
style_user = 'yellow bold'
style_root = 'black bold'
format = '[$user](#f97316) '
disabled = false
show_always = true

# Shows the hostname
[hostname]
ssh_only = false
format = '(black bold) [$hostname](bold blue) '
disabled = false

# Shows current directory
[directory]
truncation_length = 3
# truncation_symbol = '…/'
home_symbol = '~'
# read_only_style = '197'
read_only = '  '
format = '(black bold)[ $path]($style)[$read_only]($read_only_style) '
style = '#fb923c' # orange
# style = '#22d3ee' # cyan

# Shows current git branch
[git_branch]
# symbol = ' '
symbol = ' '
format = 'on (black bold)[$symbol\[$branch\]]($style)'
# truncation_length = 0
# truncation_symbol = '…/'
style = 'bold #84cc16'

# Shows current git status
[git_status]
format = '[($all_status$ahead_behind )]($style)'
style = 'bold green'
# disabled = true
# conflicted = '🏳'
# up_to_date = ''
# untracked = ' '
# ahead = '⇡${count}'
# diverged = '⇕⇡${ahead_count}⇣${behind_count}'
# behind = '⇣${count}'
# stashed = ' '
# modified = ' '
# staged = '[++\($count\)](green)'
# renamed = '襁 '
# deleted = ' '

# Shows kubernetes context and namespace
[kubernetes]
format = 'via [󱃾 $context\($namespace\)](bold purple) '
disabled = false

[time]
disabled = false
time_format = "%v %T" # Hour:Minute Format
format = '[🕙 $time ]($style)'
style = '#94a3b8'

[fill]
symbol = ' '
style = 'bold green'

[python]
symbol = '󰌠'
python_binary = ['./venv/bin/python', 'python', 'python3', 'python2']
format = '[//](#64748b bold) [${symbol} ${pyenv_prefix}(${version} )(\($virtualenv\) )]($style) '

[java]
symbol = " "
format = "[//](#64748b bold) [$symbol$version](bold red) "

[nodejs]
symbol = ""
format = "[//](#64748b bold) [$symbol $version](bold green) "
detect_files = ["package.json", ".node-version"]
detect_folders = ["node_modules"]

[golang]
symbol = " "
format = "[//](#64748b bold) [$symbol$version](bold blue) "